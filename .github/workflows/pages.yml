name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/build.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public portfolio source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      # The tests/build use only Node's standard library. No paid runtime or install.
      - name: Verify public assets and application behavior
        run: npm test
      - name: Build only public assets
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the verified public build
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
